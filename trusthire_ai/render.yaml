services:
  - type: web
    name: trusthire-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /check
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: TRUSTHIRE_HTTPS
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
